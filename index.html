<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Schritt für Schritt zur passenden NEHER-Variante: Insektenschutz für Fenster, Türen und Lichtschächte vor Ort auswählen.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#008080">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="H2 Finder">
<title>Produktfinder | H2 Montage</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="daten/finder-daten.js" defer></script>
<script src="fragen.js" defer></script>
<script src="engine.js" defer></script>
<script src="skizzen.js" defer></script>
<script src="eigenschaften.js" defer></script>
<script src="finder.js" defer></script>
</head>
<body>
<a href="#inhalt" class="skip-link">Zum Produktfinder</a>
<header class="kopf">
  <div class="kopf-innen">
    <div class="marke">
      <img src="h2-logo-weiss.svg" alt="H2 Insektenschutz" width="40" height="46">
      <span>Produktfinder</span>
    </div>
    <button type="button" class="kopf-knopf" data-aktion="neu" hidden>Neu starten</button>
  </div>
</header>
<main id="inhalt" class="rahmen">
  <noscript><p class="hinweis-box">Bitte JavaScript aktivieren, um den Produktfinder zu nutzen.</p></noscript>
  <div class="spalten">
    <section id="verlauf" class="verlauf" tabindex="-1"></section>
    <aside id="vorschau" class="vorschau" aria-label="Vorläufiges Ergebnis"></aside>
  </div>
</main>
<div id="leiste" class="leiste" hidden></div>
<footer class="fuss">
  <span>H2 Insektenschutz · Montagehilfe</span>
  <span id="version">Version 3.7</span>
</footer>
</body>
</html>
